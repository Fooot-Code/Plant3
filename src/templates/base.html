

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant³ | {% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <canvas id="bg-animation"></canvas>

    <header class="navbar">
        <div class="nav-brand">
            
            <a href="home.html">
                <img class="nav-logo" src="{{ url_for('static', path='images/sidewaysLogo.png') }}" alt="Plant³ Logo" >
            </a>

        </div>
        <nav>

            {% for item in nav_items %}
            
                <a href="{{ url_for(item.route) }}" 
                class="nav-link {{ 'active' if request.url.path == item.path }} {{ 'logout-btn' if item.label == 'Logout' }}">
                {{ item.label }}
                </a>

            {% endfor %}


        </nav>
    </header>

    <main class="container">

        {% block section %}
        {% endblock %}


    </main>

    <script src="{{ url_for('static', path='/script.js') }}"></script>
</body>
</html>
