<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Plant³</title>
	<link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <svg id="bg-animation" viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
        <path
            fill="none"
            stroke="lightgrey"
            d="M20,50 C20,-50 180,150 180,50 C180-50 20,150 20,50 z" />

        <circle r="5" fill="red">
            <animateMotion
            dur="10s"
            repeatCount="indefinite"
            path="M20,50 C20,-50 180,150 180,50 C180-50 20,150 20,50 z" />
        </circle>
    </svg>
    <div id="plants">
        <ul>
            <li>
                <h1>Plant 1</h1>
                <img class="plant-img" src="images/blueberry.png" alt="Blueberry Emoji">
                <p>Water Status: Good</p>
                <p>Leaf Health: Good</p>
            </li>
            <li>
                <h1>Plant 2</h1>
                <img class="plant-img" src="images/blueberry.png" alt="Blueberry Emoji">
                <p>Water Status: Good</p>
                <p>Leaf Health: Good</p>
            </li>
            <li>
                <h1>Plant 3</h1>
                <img class="plant-img" src="images/blueberry.png" alt="Blueberry Emoji">
                <p>Water Status: Good</p>
                <p>Leaf Health: Good</p>
            </li>
            
        </ul>
    </div>
	

	
</body>
</html>
