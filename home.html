<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant³ | Dashboard Overview</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="bg-animation"></canvas>
    <header class="navbar">
        <div class="nav-brand">
            <img class="nav-logo" src="images/sidewaysLogo.png" alt="Plant³ Logo">
        </div>
        <nav>
            <a href="home.html" class="active">Overview</a>
            <a href="plantAnalysis.html">AI Telemetry</a>
            <a href="login.html" class="logout-btn">Logout</a>
        </nav>
    </header>

    <main class="container">
        <section class="hero-banner">
            <div class="hero-text">
                <span class="badge-tag">NASA HUNCH</span>
                <h1>AI Plant Analysis</h1>
                <a href="plantAnalysis.html" class="btn-primary">Navigate to Dashboard</a>
            </div>
            <div class="hero-stats">
                <div class="stat-card">
                    <span class="stat-value">3 / 3</span>
                    <span class="stat-label">Active Chambers</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value">98.4%</span>
                    <span class="stat-label">AI Diagnostic Accuracy</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value">Nominal</span>
                    <span class="stat-label">System Health</span>
                </div>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
